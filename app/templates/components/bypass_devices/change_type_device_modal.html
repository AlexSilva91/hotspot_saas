<dialog id="changeTypeDevice_{{ device.id }}" class="modal">

    <div class="modal-header">
        <h3>Alterar Tipo de Binding</h3>
    </div>

    <form method="POST" action="/bypass-devices/{{ device.id }}/change-type">

        <div class="modal-body">

            <label>MAC Address</label>
            <input type="text"
                   value="{{ device.mac_address }}"
                   disabled>

            <label>Tipo atual</label>
            <input type="text"
                   value="{{ device.binding_type or 'bypassed' }}"
                   disabled>

            <label>Novo Tipo</label>
            <select name="binding_type" required>
                <option value="bypassed"
                        {% if device.binding_type == "bypassed" %}selected{% endif %}>
                    Bypassed — acesso livre sem login
                </option>
                <option value="blocked"
                        {% if device.binding_type == "blocked" %}selected{% endif %}>
                    Blocked — bloqueia o dispositivo
                </option>
                <option value="regular"
                        {% if device.binding_type == "regular" %}selected{% endif %}>
                    Regular — fluxo normal do hotspot
                </option>
            </select>

        </div>

        <div class="modal-footer">
            <button type="button" class="button secondary"
                    onclick="document.getElementById('changeTypeDevice_{{ device.id }}').close()">
                Cancelar
            </button>
            <button type="submit" class="button primary">
                Confirmar
            </button>
        </div>

    </form>

</dialog>
